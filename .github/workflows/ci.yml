
name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Auth Service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/auth-service/requirements.txt

      - name: Check Auth Service syntax
        run: python -m compileall -q services/auth-service/app

      - name: Run Auth Service tests
        working-directory: services/auth-service
        run: python -m pytest -v

      - name: Install Task Service dependencies
        run: pip install -r services/task-service/requirements.txt

      - name: Check Task Service syntax
        run: python -m compileall -q services/task-service/app

      - name: Run Task Service tests
        working-directory: services/task-service
        run: python -m pytest -v
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci-test-password
          JWT_SECRET_KEY: ci-test-secret
        run: docker compose config -q
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host auth-api:127.0.0.1 \
            --add-host task-api:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  docker-build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Auth Service image
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-auth:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-auth:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-auth
          cache-to: type=gha,mode=max,scope=taskflow-auth
      - name: Build and Push Task Service image
        uses: docker/build-push-action@v6
        with:
          context: services/task-service
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-task:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-task:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-task
          cache-to: type=gha,mode=max,scope=taskflow-task

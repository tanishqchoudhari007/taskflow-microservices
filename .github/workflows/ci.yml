
name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Auth Service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/auth-service/requirements.txt

      - name: Check Auth Service syntax
        run: python -m compileall -q services/auth-service/app

      - name: Install Task Service dependencies
        run: pip install -r services/task-service/requirements.txt

      - name: Check Task Service syntax
        run: python -m compileall -q services/task-service/app

  docker-build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service image
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service
          push: false
          tags: taskflow-auth:ci

      - name: Build Task Service image
        uses: docker/build-push-action@v6
        with:
          context: services/task-service
          push: false
          tags: taskflow-task:ci

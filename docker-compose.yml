
services:
  auth-db:
    image: postgres:16
    container_name: taskflow-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:16
    container_name: taskflow-task-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - task-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d task_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-api:
    build:
      context: ./services/auth-service
    image: taskflow-auth
    container_name: taskflow-auth-api
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@taskflow-auth-db:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - taskflow-network

  task-api:
    build:
      context: ./services/task-service
    image: taskflow-task
    container_name: taskflow-task-api
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@taskflow-task-db:5432/task_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8001:8001"
    depends_on:
      task-db:
        condition: service_healthy
    networks:
      - taskflow-network

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-api
      - task-api
    networks:
      - taskflow-network

volumes:
  auth-db-data:
    external: true
    name: 5e8ef978c1bdb8d8abc9af56dc0009abaa4ddf550a77560baf90b726ab3b3a10
  task-db-data:
    external: true
    name: 09de193f7a3f24a00fcc385ddf032c41d1e0561637f41f8e7135866ab5c3ee62

networks:
  taskflow-network:
    external: true
    name: taskflow-network
